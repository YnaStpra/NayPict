# Rate Limiting Zones to prevent server overload
limit_req_zone $binary_remote_addr zone=general_req_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_req_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# Upstream Backend Application Cluster (Round-Robin with Least Connections)
upstream pixtale_cluster {
    least_conn; # Route traffic to the least busy instance to prevent overloading single containers

    server app1:8082 max_fails=3 fail_timeout=10s;
    server app2:8082 max_fails=3 fail_timeout=10s;
    server app3:8082 max_fails=3 fail_timeout=10s;

    # Persistent HTTP/1.1 connection pool to backends (eliminates TCP handshake overhead)
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Maximum concurrent connections per IP
    limit_conn addr_conn_limit 50;

    # Security & Defense Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Dedicated Load Balancer Health Probe
    location = /api/health {
        proxy_pass http://pixtale_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Failover rapidly if any single instance is unresponsive
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        access_log off;
    }

    # High-Risk Auth Endpoint Protection (Brute-force & Overload Guard)
    location ~* ^/api/(user/login|user/register|totp/) {
        limit_req zone=auth_req_limit burst=10 nodelay;

        proxy_pass http://pixtale_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Fast-path & Browser Cache (Offload Node.js workers)
    location ~* ^/(_next/static|favicon.ico|robots.txt) {
        proxy_pass http://pixtale_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # 1 Year Immutable Browser Cache for Hash-versioned Next.js static assets
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # General Traffic & API Reverse Proxy
    location / {
        limit_req zone=general_req_limit burst=30 nodelay;

        proxy_pass http://pixtale_cluster;
        proxy_http_version 1.1;

        # Connection Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dynamic Failover Routing (If an app crashes, silently retry next healthy container)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;

        # Timeouts for Large Photo Uploads
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer Configuration
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
