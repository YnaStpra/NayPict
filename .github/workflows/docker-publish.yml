name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: naypict

jobs:
  # Build on native runners to avoid QEMU arm64 emulation overhead.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_tag: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push (single platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ matrix.platform_tag }}-${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ matrix.platform_tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  # Combine platform images into a multi-arch manifest and apply final tags.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest
        run: |
          set -eux
          DOCKERHUB_AMD64="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:amd64-${{ github.sha }}"
          DOCKERHUB_ARM64="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:arm64-${{ github.sha }}"
          GHCR_AMD64="ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:amd64-${{ github.sha }}"
          GHCR_ARM64="ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:arm64-${{ github.sha }}"

          # Create manifest for each tag output by metadata-action.
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            case "$tag" in
              ghcr.io/*)
                docker buildx imagetools create --tag "$tag" "$GHCR_AMD64" "$GHCR_ARM64"
                ;;
              *)
                docker buildx imagetools create --tag "$tag" "$DOCKERHUB_AMD64" "$DOCKERHUB_ARM64"
                ;;
            esac
          done <<< "${{ steps.meta.outputs.tags }}"
